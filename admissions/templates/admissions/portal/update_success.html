<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details Updated - KIHS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1c4a7a 0%, #2d6a9f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .success-container {
            max-width: 500px;
            background: #fff;
            border-radius: 16px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .success-icon {
            width: 72px;
            height: 72px;
            background: #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .success-icon svg { width: 36px; height: 36px; fill: #fff; }
        .success-container h1 {
            color: #1c4a7a;
            font-size: 22px;
            margin-bottom: 12px;
        }
        .success-container p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn-home {
            display: inline-block;
            background: #1c4a7a;
            color: #fff;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .btn-home:hover { background: #163a5f; }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <h1>Details Updated!</h1>
        <p>Your information has been updated successfully. Thank you for keeping your records current.</p>
        <a href="{% url 'portal_landing' %}" class="btn-home">Back to Portal</a>
    </div>
</body>
</html>
